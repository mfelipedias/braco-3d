server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # modelos 3D e do Teachable Machine
    types {
        model/gltf-binary glb;
        application/octet-stream bin;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
    location ~* \.(glb|bin|svg)$ { add_header Cache-Control "public, max-age=86400"; }

    location = /healthz { access_log off; return 200 "ok\n"; }
}
